     <style>
        img{
            width: 300px;
            height: 300px;
            object-fit: cover;
            border-radius: 10%;
            border: 3px solid white;
            transform-origin: center;
            transition: transform 0.3s ease;
        }
        img:hover{
            transform: scale(2);
            position:relative;
            z-index: 10;
        }
        video
        {
            display: block;
            width: 700px;
            height: 400px;
            object-fit: cover;
            border-radius: 5%;
            
        }
        p{
            font-weight: bold;
            font-size: larger;
        }
        body{
            background: linear-gradient(
        135deg,
       #38f9d7,
       #0e4c54,
       #43a5d9
    );
    background-attachment: fixed;
    background-size: 400% 400%;
    animation: neonGradient 10s ease infinite;
    color: #ffffff;
    padding-top: 60px;
        }
        @keyframes neonGradient{
          0%{
        background-position: 0% 50%;
    }
    50%{
        background-position: 100% 50%;
    }
    100%{
        background-position: 0% 50%;
    }   
        }
        nav{
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: aliceblue;
            z-index: index 100%;
            padding: 12px 0;

        }
        nav ul{
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            gap:  30px;
        }
