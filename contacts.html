<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- style -->
     <style>
        html,body{
            background-color: blanchedalmond;
            height: 100%;
            margin: 0;
        }
        body{
             background: linear-gradient(
        135deg,
        #FFD36E,
        #be6424,
        #FF8C69
           );
         background-attachment: fixed;
    background-size: 400% 400%;
    animation: neonGradient 10s ease infinite;
    color: #ffffff;
        }
        @keyframes neonGradient{
             0%{
        background-position: 0% 50%;
    }
    50%{
        background-position: 100% 50%;
    }
    100%{
        background-position: 0% 50%;
    }   
        }
        body{
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding-top: 60px;
        }
        main{
            flex: 1;
        }
        footer{
            background: #222;
            color: white;
            text-align: center;
            padding: 18px;
        }
        form{
            max-width: 400px;
            margin: 30px auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        input, textarea{
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }
         nav{
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: rgba(234, 172, 118, 0.777);
            z-index: index 100%;
            padding: 12px 0;
            box-shadow: 0 2px 5px rgba(234, 172, 118, 0.777);
        }
        nav ul{
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            gap: 30px;
        }
        a{
            display: inline-block;
            padding: 10px 20px;
            background-color: rgb(171, 69, 6);
            text-decoration: none;
            border-radius: 6px;
            font-family: Arial, Helvetica, sans-serif;
            color: rgb(255, 250, 250);
        }
     </style>
    <!-- contacts -->
<main>
    <center>
        <h1>Contact</h1>
    
        <form action="https://formspree.io/f/mjyyvonk" method="post">
            <input type="text" name="name" placeholder="full name" required >  
            <input type="email" name="email" placeholder="email" required>   
            <input type="text" name="subject" placeholder="subject" required>   
            <textarea name="message" placeholder="message" rows="5" required></textarea>   
            <input type="submit" value="submit">
        </form>

         <a href="https://www.facebook.com/share/1Fi9cSH6pC/" 
         style="text-decoration: none; color: rgb(246, 246, 250); font-size:larger;">facebook</a>
        
    </center>
</main>

</nav>

</html>
